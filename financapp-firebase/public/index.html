<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinançApp — Entrar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#22c55e', 600: '#16a34a' } } } }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase v9 compat (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <style>
        body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen bg-gray-950 flex items-center justify-center p-4 font-sans">

    <!-- Login Card -->
    <div class="w-full max-w-sm">

        <!-- Brand -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-brand-500/10 rounded-2xl mb-4">
                <i data-lucide="wallet" class="w-7 h-7 text-brand-500"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">FinançApp</h1>
            <p class="text-sm text-gray-400 mt-1">Controle financeiro pessoal</p>
        </div>

        <!-- Card -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl space-y-5">

            <!-- Tab Switcher -->
            <div class="flex bg-gray-800 rounded-xl p-1 gap-1">
                <button id="tabLogin" onclick="setMode('login')"
                    class="flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-gray-700 text-white shadow-sm">
                    Entrar
                </button>
                <button id="tabRegister" onclick="setMode('register')"
                    class="flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-white">
                    Criar Conta
                </button>
            </div>

            <!-- Form -->
            <form id="authForm" class="space-y-4" onsubmit="handleEmailAuth(event)">

                <!-- Name field (register only) -->
                <div id="nameField" class="hidden">
                    <label class="block text-xs font-medium text-gray-400 mb-1.5">Nome completo</label>
                    <div class="relative">
                        <i data-lucide="user" class="w-4 h-4 absolute left-3 top-3 text-gray-500"></i>
                        <input id="inputName" type="text" placeholder="Seu nome"
                            class="w-full pl-10 pr-4 py-2.5 bg-gray-800 border border-gray-700 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-colors">
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5">E-mail</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-4 h-4 absolute left-3 top-3 text-gray-500"></i>
                        <input id="inputEmail" type="email" placeholder="seu@email.com" required
                            class="w-full pl-10 pr-4 py-2.5 bg-gray-800 border border-gray-700 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-colors">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5">Senha</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 absolute left-3 top-3 text-gray-500"></i>
                        <input id="inputPassword" type="password" placeholder="Mínimo 6 caracteres" required
                            class="w-full pl-10 pr-10 py-2.5 bg-gray-800 border border-gray-700 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-colors">
                        <button type="button" onclick="togglePassword()" class="absolute right-3 top-3 text-gray-500 hover:text-gray-300">
                            <i data-lucide="eye" id="eyeIcon" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Forgot password (login only) -->
                <div id="forgotRow" class="text-right -mt-2">
                    <button type="button" onclick="handleForgotPassword()"
                        class="text-xs text-brand-500 hover:text-brand-600 hover:underline">
                        Esqueci minha senha
                    </button>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btnSubmit"
                    class="w-full py-3 bg-brand-500 hover:bg-brand-600 active:bg-green-700 text-white font-semibold text-sm rounded-xl transition-all flex items-center justify-center space-x-2 shadow-lg shadow-brand-500/20">
                    <i data-lucide="log-in" id="btnIcon" class="w-4 h-4"></i>
                    <span id="btnText">Entrar na conta</span>
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-3">
                <div class="flex-1 h-px bg-gray-800"></div>
                <span class="text-xs text-gray-500">ou continue com</span>
                <div class="flex-1 h-px bg-gray-800"></div>
            </div>

            <!-- Google Sign-In -->
            <button onclick="handleGoogleAuth()" id="btnGoogle"
                class="w-full py-2.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white text-sm font-medium rounded-xl transition-colors flex items-center justify-center space-x-2.5">
                <!-- Google SVG logo -->
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span>Entrar com Google</span>
            </button>

            <!-- Error message -->
            <div id="errorBox" class="hidden bg-rose-950/60 border border-rose-800 text-rose-300 text-xs rounded-xl px-3.5 py-2.5 flex items-start space-x-2">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
                <span id="errorText"></span>
            </div>
        </div>

        <p class="text-center text-xs text-gray-600 mt-6">Seus dados ficam protegidos no Firebase. Nenhuma informação é compartilhada.</p>
    </div>

    <script>
        // =============================================
        // FIREBASE CONFIG — substitua pelos seus dados
        // =============================================
        const firebaseConfig = {
            apiKey:            "AIzaSyCmayvyEF4NQHep80lFjo9iZRVdBkFGNec",
            authDomain:        "financapp-c3641.firebaseapp.com",
            projectId:         "financapp-c3641",
            storageBucket:     "financapp-c3641.firebasestorage.app",
            messagingSenderId: "1006458419726",
            appId:             "1:1006458419726:web:20bc352efeecc720a61a5f",
            measurementId:     "G-MV1S3HQX2C"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Redirect if already logged in
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'app.html';
        });

        // =============================================
        // UI State
        // =============================================
        let currentMode = 'login';

        function setMode(mode) {
            currentMode = mode;
            const isLogin = mode === 'login';

            document.getElementById('tabLogin').className = `flex-1 py-2 text-sm font-medium rounded-lg transition-all ${isLogin ? 'bg-gray-700 text-white shadow-sm' : 'text-gray-400 hover:text-white'}`;
            document.getElementById('tabRegister').className = `flex-1 py-2 text-sm font-medium rounded-lg transition-all ${!isLogin ? 'bg-gray-700 text-white shadow-sm' : 'text-gray-400 hover:text-white'}`;

            document.getElementById('nameField').classList.toggle('hidden', isLogin);
            document.getElementById('forgotRow').classList.toggle('hidden', !isLogin);
            document.getElementById('btnText').textContent = isLogin ? 'Entrar na conta' : 'Criar conta';
            document.getElementById('btnIcon').setAttribute('data-lucide', isLogin ? 'log-in' : 'user-plus');
            hideError();
            lucide.createIcons();
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('btnSubmit');
            const btnGoogle = document.getElementById('btnGoogle');
            if (isLoading) {
                btn.disabled = true;
                btnGoogle.disabled = true;
                btn.innerHTML = `<svg class="w-4 h-4 spinner" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="white" stroke-width="4"/><path class="opacity-75" fill="white" d="M4 12a8 8 0 018-8v8H4z"/></svg><span>Aguarde...</span>`;
            } else {
                btn.disabled = false;
                btnGoogle.disabled = false;
                setMode(currentMode);
            }
        }

        function showError(msg) {
            const box = document.getElementById('errorBox');
            document.getElementById('errorText').textContent = msg;
            box.classList.remove('hidden');
            lucide.createIcons();
        }

        function hideError() {
            document.getElementById('errorBox').classList.add('hidden');
        }

        function togglePassword() {
            const input = document.getElementById('inputPassword');
            const icon = document.getElementById('eyeIcon');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.setAttribute('data-lucide', isHidden ? 'eye-off' : 'eye');
            lucide.createIcons();
        }

        // =============================================
        // Auth Handlers
        // =============================================
        function mapFirebaseError(code) {
            const messages = {
                'auth/user-not-found':        'Nenhuma conta encontrada com este e-mail.',
                'auth/wrong-password':        'Senha incorreta. Tente novamente.',
                'auth/email-already-in-use':  'Este e-mail já está cadastrado. Tente entrar.',
                'auth/weak-password':         'A senha deve ter pelo menos 6 caracteres.',
                'auth/invalid-email':         'Formato de e-mail inválido.',
                'auth/too-many-requests':     'Muitas tentativas. Aguarde alguns minutos.',
                'auth/popup-closed-by-user':  'Login com Google cancelado.',
                'auth/invalid-credential':    'E-mail ou senha incorretos.',
                'auth/operation-not-allowed': 'Método de login não habilitado no Firebase Console.',
                'auth/network-request-failed':'Sem conexão. Verifique sua internet.',
                'auth/internal-error':        'Erro interno do Firebase. Tente novamente.',
                'auth/configuration-not-found': 'Configuração do Firebase inválida. Verifique o domínio autorizado.',
            };
            return messages[code] || `Erro: ${code || 'desconhecido'}. Tente novamente.`;
        }

        async function handleEmailAuth(e) {
            e.preventDefault();
            hideError();
            setLoading(true);

            const email    = document.getElementById('inputEmail').value.trim();
            const password = document.getElementById('inputPassword').value;
            const name     = document.getElementById('inputName').value.trim();

            try {
                if (currentMode === 'login') {
                    await auth.signInWithEmailAndPassword(email, password);
                } else {
                    if (!name) { showError('Por favor, informe seu nome.'); setLoading(false); return; }
                    const cred = await auth.createUserWithEmailAndPassword(email, password);
                    await cred.user.updateProfile({ displayName: name });
                }
                // onAuthStateChanged handles redirect
            } catch (err) {
                showError(mapFirebaseError(err.code));
                setLoading(false);
            }
        }

        async function handleGoogleAuth() {
            hideError();
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await auth.signInWithPopup(provider);
            } catch (err) {
                showError(mapFirebaseError(err.code));
            }
        }

        async function handleForgotPassword() {
            const email = document.getElementById('inputEmail').value.trim();
            if (!email) { showError('Informe seu e-mail acima para redefinir a senha.'); return; }
            try {
                await auth.sendPasswordResetEmail(email);
                hideError();
                showError('✅ E-mail de redefinição enviado! Verifique sua caixa de entrada.');
            } catch (err) {
                showError(mapFirebaseError(err.code));
            }
        }

        // Init icons
        document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
    </script>
</body>
</html>
